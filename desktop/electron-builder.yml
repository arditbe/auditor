appId: com.auditor.desktop
productName: Auditor
copyright: Auditor

directories:
  output: dist
  buildResources: build

# Only the shell's own code is packed into the asar. The Python runtime and the
# built dashboard are extraResources: asar cannot execute a bundled binary, and
# the backend must be a real file on disk to spawn.
files:
  - main.js
  - preload.js
  - package.json

extraResources:
  - from: resources/backend
    to: backend
  - from: ../frontend/dist
    to: ui

asar: true

# The bundled interpreter and its extension modules are already signed by
# python-build-standalone; re-signing them breaks the runtime.
asarUnpack: []

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # Ad-hoc signed. Users will see Gatekeeper's unidentified-developer warning
  # unless you supply a Developer ID certificate.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSHighResolutionCapable: true

dmg:
  title: Auditor
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

# The bundle carries a Python runtime, so stronger compression costs build time
# for a small download-size win.
compression: normal
